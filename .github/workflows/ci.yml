name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 に替わる。替わり目でビルドが変わらないよう 24.04 に固定する。
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # 証明の穴（sorry / admit）・native_decide・自前の axiom が MathGarden/ に無いこと（grep）。
      # 先に対照（わざと鳴る入力）で検査が鳴ることを確かめる。ビルドより先に走らせて早く落とす。
      - name: Forbidden words (sorry / admit / native_decide / axiom)
        run: bash scripts/check_forbidden.sh

      # lake exe cache get（Mathlib のビルド済みファイル）→ lake build
      # use-github-cache: false … 最初の実行（run 38518351697）で、.lake（Mathlib 込み）を
      # GitHub の cache に固める段で runner のディスクが尽きた（No space left on device・警告のみ）。
      # Mathlib のビルド済みファイルは lake exe cache get で約2分で取れるので、.lake は保存しない。
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: true
          test: false
          lint: false

      # verified.json の欄と配置、各宣言の公理（#print axioms）を確かめる。
      - name: verified.json and axioms
        run: python3 scripts/check_verified.py
