name = "mathgarden"
version = "0.1.0"
defaultTargets = ["MathGarden"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib は lean-toolchain（v4.30.0）と同じ版のタグに固定する。
# 実際に使う commit は lake-manifest.json に書いてある（タグ v4.30.0 = c5ea00351c28e24afc9f0f84379aa41082b1188f）。
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.30.0"

[[lean_lib]]
name = "MathGarden"
